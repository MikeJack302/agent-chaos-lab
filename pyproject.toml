[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chaos-lab"
version = "0.1.0"
description = "Deterministic chaos experiments for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MikeJack302" }]
keywords = ["agents", "reliability", "chaos-engineering", "fault-injection", "slo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
agent-chaos = "agentchaos.cli:main"

[tool.setuptools.packages.find]
include = ["agentchaos*"]
