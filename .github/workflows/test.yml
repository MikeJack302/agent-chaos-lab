name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m agentchaos lint examples/research-agent.json examples/policies.json --json
      - run: python -m agentchaos run examples/research-agent.json examples/policies.json --runs 1000 --bootstrap-samples 100 -o agent-chaos-report.html --json-output experiment.out.json
